name: SKN_3rd_PJ Discord Reminders

on:
  schedule:
    # 10:05 KST, Monday-Friday.
    - cron: "5 1 * * 1-5"
    # 17:05 KST, Monday-Friday.
    - cron: "5 8 * * 1-5"
  workflow_dispatch:
    inputs:
      reminder:
        description: "Reminder to send"
        required: true
        default: focus
        type: choice
        options:
          - focus
          - progress

permissions:
  contents: read

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Select reminder message
        id: reminder
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_REMINDER: ${{ github.event.inputs.reminder || '' }}
        run: |
          should_send=true
          skip_reason=""
          kst_time="$(TZ=Asia/Seoul date '+%H:%M')"

          if [ "$MANUAL_REMINDER" = "focus" ]; then
            echo "message=오전 10시입니다. 에어팟을 끼고 각자 할 일에 집중해주세요. 대화는 DM으로 부탁드려요 🙏" >> "$GITHUB_OUTPUT"
          elif [ "$MANUAL_REMINDER" = "progress" ]; then
            echo "message=오후 5시입니다. 오늘 각자 진행상황을 팀 Notion에 업로드해주세요." >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "5 1 * * 1-5" ]; then
            echo "message=오전 10시입니다. 에어팟을 끼고 각자 할 일에 집중해주세요. 대화는 DM으로 부탁드려요 🙏" >> "$GITHUB_OUTPUT"
            if [[ "$kst_time" != 10:0[0-9] && "$kst_time" != 10:1[0-4] ]]; then
              should_send=false
              skip_reason="Scheduled run delayed outside 10:00-10:14 KST window. Actual KST time: $kst_time."
            fi
          elif [ "$SCHEDULE" = "5 8 * * 1-5" ]; then
            echo "message=오후 5시입니다. 오늘 각자 진행상황을 팀 Notion에 업로드해주세요." >> "$GITHUB_OUTPUT"
            if [[ "$kst_time" != 17:0[0-9] && "$kst_time" != 17:1[0-4] ]]; then
              should_send=false
              skip_reason="Scheduled run delayed outside 17:00-17:14 KST window. Actual KST time: $kst_time."
            fi
          else
            echo "Unsupported reminder schedule: $SCHEDULE"
            exit 1
          fi

          echo "should_send=$should_send" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"

      - name: Send Discord message
        if: steps.reminder.outputs.should_send == 'true'
        env:
          MESSAGE: ${{ steps.reminder.outputs.message }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL GitHub secret is not configured."
            exit 1
          fi

          payload=$(jq -nc \
            --arg content "$MESSAGE" \
            --arg username "Notion 알림봇" \
            '{content: $content, username: $username}')

          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --header "User-Agent: SKN_3rd_PJ Reminder Bot (GitHub Actions)" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"

      - name: Report skipped reminder
        if: steps.reminder.outputs.should_send == 'false'
        run: |
          echo "${{ steps.reminder.outputs.skip_reason }}"
